# REV14: same ResNet8 x4, no pretrained weights or extra training labels.
experiment_engine: trusted_multi
dataset: CIFAR10
alpha: 0.1
seed: 7
partition_seed: 0
num_clients: 20
num_online_clients: 8
max_rounds: 300
local_epochs: 5
mu: 2
batch_size_local_labeled_fixmatch: 128
batch_size_test: 512
num_workers: 16
lr_local_training: 0.15
lr_min: 0.0001
tau_warmup: 0.95
eta_B: 0.60
lambda_A: 1.0
lambda_B: 1.0
lambda_proto: 0.1
pp_proto_T: 0.2
tm_main_rounds: 300
tm_tail_rounds: 0
tm_tail_lr: 0.0001
tm_start: 10
tm_ramp: 50
tm_local_ema: 0.99
tm_server_ema: 0.8
tm_prototypes: 3
tm_min_support: 8
tm_geometry_mix: 0.5
tm_feature_weight: 0.2
tm_clip_factor: 2.0
tm_distribution_align: 0.0
